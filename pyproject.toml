[project]
name = "handball"
version = "0.1.0"
description = "Handball DataScience - serwis danych meczowych polskich seniorskich lig pilki recznej"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask>=3.1,<3.2",
    "flask-sqlalchemy>=3.1,<3.2",
    "psycopg[binary]>=3.2,<3.3",
    "sqlalchemy>=2.0,<2.1",
    "wtforms>=3.1,<3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "types-wtforms>=3.2.1.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handball"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src"]
